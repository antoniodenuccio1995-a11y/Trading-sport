# Compila l'app (cartella app/), esegue i test e la pubblica sul ramo gh-pages
# (GitHub Pages: https://antoniodenuccio1995-a11y.github.io/Trading-sport/).
name: Pubblica app

on:
  push:
    branches: [main]
    paths: ["app/**", "supabase/functions/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Pubblica app"
      # chiede a GitHub Pages di ricostruire il sito (innocuo se lo fa già da solo)
      - name: Aggiorna GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
