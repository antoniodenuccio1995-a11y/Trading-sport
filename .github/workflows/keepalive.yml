# Interroga ogni giorno il database Supabase: il piano gratuito mette in pausa
# i progetti senza attività per 7 giorni. È una seconda sicurezza: anche gli
# aggiornamenti automatici dei dati (pg_cron) scrivono nel database due volte al giorno.
name: Supabase attivo

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lettura dal database
        env:
          URL: https://cqfxjvrpspvycocvxghv.supabase.co
          KEY: sb_publishable_VQS48ywRaUafRirZIyo5EQ_8KMjSDfm
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" "$URL/rest/v1/ta_sync_runs?select=at&order=at.desc&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"; cat out.json; echo
          test "$code" = "200"
